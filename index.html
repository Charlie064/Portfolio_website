<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Sandvall</title>
    <link rel="stylesheet" href="./css/first_css.css">
    <link rel="stylesheet" href="./css/text_animations.css">

</head>
<body>
    <header>
    <p class="navbar-container">
        <a class="navbar-item" href="./pages/about.html">About</a>
        <a class="navbar-item" href="./pages/about.html">Playground</a>
        <a class="navbar-item" href="./pages/about.html">Projects</a>
    </p>
    </header>
    <!-- Hero section -->
    <section class="site-hero">
        <div class="hero-inner">
            <h1 class="hero-heading">
                <span class="text-noaccent">Hello, I'm</span>
                <span class="text-accent"> Carl Sandvall</span>
            </h1>
            <p class="hero-tagline text-noaccent">
                <span id="typed-text"></span><span class="cursor">█</span>
            </p>
        </div>
        <button class="scroll-indicator" aria-label="Scroll down">
        <svg class="scroll-icon" viewBox="0 0 24 24">
            <line x1="6"  y1="9"  x2="12" y2="15" />
            <line x1="18" y1="9"  x2="12" y2="15" />
        </svg>
        
            </svg>
        </button>
    </section>

    <!-- Oscilloscope -->
    <section class="oscilloscope-section">
        <div class="scope-wrapper">
            <img src="../images/oscilloscope.png" class="scope-image">
            <div class="scope-screen">
                <svg class="oscilloscope-plot"
                    viewBox="0 0 1000 1000"
                    preserveAspectRatio="none">
                </svg>

                <div class="scope-controls">
                    <button id="ch1-btn" class="scope-btn active">CH 1</button>
                    <button id="ch3-btn" class="scope-btn">CH 3</button>
                </div>
            </div>
        </div>
    </section>


    <!-- Other stuff -->

    <!-- Scripts -->
    <script src="javascript/typing_animation.js"></script>
    <script src="javascript/scroll.js"></script>
    <script src="javascript/oscilloscope.js"></script>


</body>
</html>
